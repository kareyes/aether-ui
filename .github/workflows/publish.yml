name: Publish Package

on:
  release:
    types: [created]
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish (leave empty to use package.json version)'
        required: false
        type: string

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      # write, not read: the release-asset upload below needs it
      contents: write
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.9

      # Node is still the runtime for vite / svelte-kit / svelte-package, and
      # this step writes the authenticated ~/.npmrc used to publish.
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://npm.pkg.github.com'
          scope: '@kareyes'

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run type check
        run: bun run check

      - name: Build package
        run: bun run build:package

      # Token-free install path, attached first so a registry failure cannot
      # block it. Installing from GitHub Packages needs a read:packages PAT
      # even for a public repo; a release asset needs nothing:
      #   bun add https://github.com/kareyes/aether-ui/releases/download/<tag>/<file>.tgz
      - name: Pack tarball
        run: bun pm pack --destination ./release-artifacts

      - name: Attach tarball to release
        if: github.event_name == 'release'
        run: gh release upload "${{ github.event.release.tag_name }}" ./release-artifacts/*.tgz --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # setup-node writes its authenticated .npmrc to a temp path and exports
      # NPM_CONFIG_USERCONFIG. npm honours that variable; bun does not, and
      # fails with "missing authentication". Verified locally: bun reads only
      # $HOME/.npmrc. Write it explicitly rather than copying setup-node's
      # file, so this does not depend on that file's location or contents.
      # The runner is ephemeral, so the resolved token lives only for the job.
      - name: Publish to GitHub Packages
        run: |
          printf '//npm.pkg.github.com/:_authToken=%s\n@kareyes:registry=https://npm.pkg.github.com/\n' \
            "$NODE_AUTH_TOKEN" > "$HOME/.npmrc"
          echo "npmrc written to $HOME/.npmrc:"
          sed 's/_authToken=.*/_authToken=<redacted>/' "$HOME/.npmrc"
          bun publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
