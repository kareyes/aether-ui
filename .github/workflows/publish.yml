name: Publish Package

on:
  release:
    types: [created]
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish (leave empty to use package.json version)'
        required: false
        type: string

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      # write, not read: the release-asset upload below needs it
      contents: write
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.9

      # Node is still the runtime for vite / svelte-kit / svelte-package, and
      # this step writes the authenticated ~/.npmrc used to publish.
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://npm.pkg.github.com'
          scope: '@kareyes'

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run type check
        run: bun run check

      - name: Build package
        run: bun run build:package

      # Token-free install path, attached first so a registry failure cannot
      # block it. Installing from GitHub Packages needs a read:packages PAT
      # even for a public repo; a release asset needs nothing:
      #   bun add https://github.com/kareyes/aether-ui/releases/download/<tag>/<file>.tgz
      - name: Pack tarball
        run: bun pm pack --destination ./release-artifacts

      - name: Attach tarball to release
        if: github.event_name == 'release'
        run: gh release upload "${{ github.event.release.tag_name }}" ./release-artifacts/*.tgz --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Published with npm, not bun. bun publish cannot see the credentials
      # setup-node provides: it ignores NPM_CONFIG_USERCONFIG, and even with a
      # correct $HOME/.npmrc it still reports "missing authentication" here,
      # though the same file satisfies `bun publish --dry-run` locally. npm is
      # what setup-node is built to configure, so hand it the tarball bun
      # already packed. Publishing a tarball also skips prepublishOnly, so the
      # package is not rebuilt a second time.
      - name: Publish to GitHub Packages
        run: npm publish ./release-artifacts/*.tgz --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
