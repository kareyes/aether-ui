name: Publish Package

on:
  release:
    types: [created]
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish (leave empty to use package.json version)'
        required: false
        type: string

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      # write, not read: the release-asset upload below needs it
      contents: write
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.9

      # Node is still the runtime for vite / svelte-kit / svelte-package, and
      # this step writes the authenticated ~/.npmrc used to publish.
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://npm.pkg.github.com'
          scope: '@kareyes'

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run type check
        run: bun run check

      - name: Build package
        run: bun run build:package

      - name: Publish to GitHub Packages
        run: bun publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Token-free install path. Installing from GitHub Packages requires the
      # consumer to hold a read:packages PAT even for a public repo; a release
      # asset on a public repo requires nothing:
      #   bun add https://github.com/kareyes/aether-ui/releases/download/<tag>/<file>.tgz
      - name: Pack tarball
        run: bun pm pack --destination ./release-artifacts

      - name: Attach tarball to release
        if: github.event_name == 'release'
        run: gh release upload "${{ github.event.release.tag_name }}" ./release-artifacts/*.tgz --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
